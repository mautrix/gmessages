syntax = "proto3";
package rcs;

option go_package = "../gmproto";

import "authentication.proto";
import "util.proto";

message RCSDeviceID {
    int32 type = 1; // 3
    string deviceID = 2; // messages-web-{session id hex}
}

message RCSPublicKey {
    int32 type = 1; // 2 = P-256 SubjectPublicKeyInfo
    bytes key = 2;
}

message RCSIntList {
    repeated int32 values = 1;
}

message RCSRegistrationInfo {
    RCSDeviceID deviceID = 1;
    RCSPublicKey publicKey = 6;
    string locale = 8;
    RCSIntList clientFlags = 16; // [6]
    RCSIntList capabilities = 30; // [4, 5]
}

message SignInSecondaryRequest {
    authentication.AuthMessage authMessage = 1;
    authentication.Device linkID = 2; // {16, gaia email, "RCS"}
    authentication.Device selfID = 3; // {1, own E.164 number, "RCS"}
    RCSRegistrationInfo registration = 4;
}

message SignInSecondaryResponse {
    message Result {
        authentication.TokenData tokenData = 1;
        bytes registrationID = 2;
    }
    Result result = 2;
}

message RCSRegisterRefreshRequest {
    authentication.AuthMessage authMessage = 1;
    authentication.Device currDevice = 2;
    int64 unixTimestamp = 3;
    bytes signature = 4;
    RCSRegistrationInfo registration = 13;
    int32 messageType = 16;
}

message ListIdentitiesRequest {
    authentication.AuthMessage authMessage = 1;
    authentication.Device linkID = 2;
}

message ListIdentitiesResponse {
    repeated authentication.Device identities = 2;
}

message LookupRegisteredRequest {
    authentication.AuthMessage authMessage = 1;
    repeated authentication.Device ids = 2;
    bool unknownBool7 = 7;
}

message LookupRegisteredResponse {
    message StringWrapper {
        string value = 1;
    }
    message Feature {
        StringWrapper name = 1;
        StringWrapper value = 2;
        int32 type = 3;
    }
    message Registration {
        bytes registrationID = 1;
        repeated int32 capabilities = 2;
        RCSPublicKey key = 3;
        repeated Feature features = 6;
    }
    message Result {
        authentication.Device ID = 1;
        int32 state = 2;
        repeated Registration registrations = 5;
    }
    repeated Result results = 4;
}

message RCSContentPart {
    string contentType = 1;
    bytes data = 2;
}

message RCSHeader {
    string namespace = 1;
    string name = 2;
    string value = 3;
}

message RCSContent {
    repeated RCSContentPart parts = 1;
    repeated RCSHeader headers = 2;
}

message TachyonInboxMessage {
    string messageID = 1;
    int32 messageType = 2; // 36 = RCS message, 45 = encrypted reflection
    int64 timestamp = 3;
    int32 messageClass = 5;
    int64 expiry = 6;
    authentication.Device sender = 8;
    authentication.Device receiver = 9;
    authentication.Device group = 10;
    bytes payload = 12;
}

message TachyonSendMessageRequest {
    authentication.Device dest = 1;
    TachyonInboxMessage message = 2;
    authentication.AuthMessage authMessage = 3;
    int32 unknownInt15 = 15;
}

message TachyonSendMessageResponse {
    int64 timestamp = 2;
}

message TachyonReceiveMessagesRequest {
    authentication.AuthMessage authMessage = 1;
    message UnknownEmptyObject1 {}
    message UnknownEmptyObject2 {
        UnknownEmptyObject1 unknown = 2;
    }
    UnknownEmptyObject2 unknown = 4;
}

message TachyonStreamItem {
    TachyonInboxMessage data = 2;
    util.EmptyArr heartbeat = 3;
}

message RCSReflectionPlaintext {
    RCSContent content = 1;
}

message RCSReflectionEnvelope {
    bytes encryptedContent = 1;
    authentication.Device destination = 2;
}
